spring:
  application:
    name: currency-converter

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/currencydb}
    username: ${SPRING_DATASOURCE_USERNAME:currencyuser}
    password: ${SPRING_DATASOURCE_PASSWORD:currencypass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: 2000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET:your_super_secret_jwt_key_change_this_in_production_min_256_bits_length}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
  
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true

  rate-fetch-interval: ${RATE_FETCH_INTERVAL:10000}
  mock-mode: ${MOCK_MODE:false}

  exchange-api:
    key: b741f29e8dd7aa072633663f
    base-url: https://v6.exchangerate-api.com/v6/b741f29e8dd7aa072633663f
  
  crypto-api:
    key: 
    base-url: https://api.coingecko.com/api/v3
  
  news-api:
    key: 92fd73c5927c405489364c331e2d89af
    base-url: https://newsapi.org/v2

  # Web Push VAPID
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@example.com}

# Logging
logging:
  level:
    root: INFO
    com.example.currency: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/currency-converter.log

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized